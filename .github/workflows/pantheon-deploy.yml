name: Deploy Code to Pantheon

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PANTHEON_SSH_PRIVATE_KEY }}

      - name: Add Pantheon Host to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.PANTHEON_PORT }} ${{ secrets.PANTHEON_HOST }} >> ~/.ssh/known_hosts

      - name: Push Code to Pantheon Git
        run: |
          git remote add pantheon ssh://codeserver.dev.${{ secrets.PANTHEON_HOST }}@${{ secrets.PANTHEON_HOST }}:${{ secrets.PANTHEON_PORT }}/~/repository.git || true
          git push pantheon main:master --force