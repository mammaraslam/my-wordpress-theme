name: Deploy Code to Pantheon

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PANTHEON_SSH_PRIVATE_KEY }}

      - name: Add Pantheon Host to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.PANTHEON_PORT }} ${{ secrets.PANTHEON_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Theme to Pantheon
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

          # Clone the Pantheon repository into a temporary folder
          git clone ssh://codeserver.dev.${{ secrets.PANTHEON_HOST }}@${{ secrets.PANTHEON_HOST }}:${{ secrets.PANTHEON_PORT }}/~/repository.git pantheon-repo
          cd pantheon-repo

          # Create the Astra theme directory if it doesn't exist
          mkdir -p wp-content/themes/astra

          # Copy theme files from the GitHub workspace root (parent directory) into Pantheon's theme folder
          rsync -av --exclude='.git' --exclude='.github' --exclude='pantheon-repo' ../ wp-content/themes/astra/

          # Stage all changes inside the repository to ensure style.css and template files are tracked
          git add -A
          git status

          if git diff-index --quiet HEAD; then
            echo "No changes to deploy."
          else
            git commit -m "Automated sync: Correct path to deploy Astra theme files"
            git push origin master
          fi